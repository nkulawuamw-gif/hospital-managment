{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HMS Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0d9488 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 1rem;
        }
        .login-card {
            background: #fff;
            border-radius: 1.25rem;
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #0d9488, #14b8a6, #f59e0b);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo .logo-icon {
            width: 80px; height: 80px;
            background: #fff;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,.12);
            position: relative;
        }
        .redcross {
            position: relative;
            width: 44px; height: 44px;
        }
        .redcross::before,
        .redcross::after {
            content: '';
            position: absolute;
            background: #dc2626;
            border-radius: 4px;
        }
        .redcross::before {
            width: 100%; height: 32%;
            top: 34%; left: 0;
        }
        .redcross::after {
            width: 32%; height: 100%;
            top: 0; left: 34%;
        }
        .login-logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 1rem;
            color: #0f172a;
        }
        .login-logo p {
            font-size: .85rem;
        }
        .form-control {
            border-radius: .6rem;
            padding: .75rem 1rem;
            font-size: .9rem;
            border: 1.5px solid #e2e8f0;
            transition: all .2s;
        }
        .form-control:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13,148,136,.12);
        }
        .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            color: #94a3b8;
            border-radius: .6rem 0 0 .6rem;
        }
        .input-group .form-control {
            border-left: 0;
            border-radius: 0 .6rem .6rem 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #0d9488;
            color: #0d9488;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            border: none;
            border-radius: .6rem;
            padding: .75rem;
            font-weight: 600;
            font-size: .9rem;
            transition: all .25s;
            box-shadow: 0 4px 16px rgba(13,148,136,.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(13,148,136,.4);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">
                <div class="redcross"></div>
            </div>
            <h1>Hope Medi - Clinic</h1>
            <p class="text-muted">Sign in to your account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="admin@hospital.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <p class="text-center text-muted mt-4 small" style="font-size: .75rem;">
            &copy; {% now "Y" %} Hope Medi - Clinic. All rights reserved.
        </p>
    </div>
</body>
</html>
