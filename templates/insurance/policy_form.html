{% extends 'base.html' %}
{% block title %}New Insurance Policy - HMS{% endblock %}
{% block page_title %}Register Insurance Policy{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-medium">Patient *</label>
                <select name="patient" class="form-select select2" required>
                    <option value="">-- Select Patient --</option>
                    {% for p in patients %}
                    <option value="{{ p.pk }}">{{ p.first_name }} {{ p.last_name }} ({{ p.patient_id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Insurance Company *</label>
                <select name="insurance_company" class="form-select" required>
                    <option value="">-- Select Company --</option>
                    {% for c in companies %}
                    <option value="{{ c.pk }}">{{ c.name }} ({{ c.coverage_percentage }}%)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Policy Number *</label>
                <input type="text" name="policy_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Coverage (%)</label>
                <input type="number" name="coverage_percentage" class="form-control" value="80">
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Start Date *</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">End Date</label>
                    <input type="date" name="end_date" class="form-control">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Register Policy</button>
                <a href="{% url 'insurance:policy_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
