{% extends 'base.html' %}
{% block title %}New Leave Request - HMS{% endblock %}
{% block page_title %}Submit Leave Request{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-medium">Employee *</label>
                <select name="employee" class="form-select select2" required>
                    <option value="">-- Select Employee --</option>
                    {% for e in employees %}
                    <option value="{{ e.pk }}">{{ e.employee_id }} - {{ e.user.get_full_name|default:e.user.email }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Leave Type *</label>
                <select name="leave_type" class="form-select" required>
                    <option value="annual">Annual Leave</option>
                    <option value="sick">Sick Leave</option>
                    <option value="maternity">Maternity Leave</option>
                    <option value="paternity">Paternity Leave</option>
                    <option value="unpaid">Unpaid Leave</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Start Date *</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">End Date *</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-medium">Reason *</label>
                <textarea name="reason" class="form-control" rows="3" required></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Submit Request</button>
                <a href="{% url 'hr:leave_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
