{% extends 'base.html' %}
{% block title %}New Purchase Order - HMS{% endblock %}
{% block page_title %}Create Purchase Order{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-medium">Supplier *</label>
                <select name="supplier" class="form-select select2" required>
                    <option value="">-- Select Supplier --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.pk }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <h6 class="fw-semibold mb-3">Order Items</h6>
            <table class="table table-bordered" style="font-size: .85rem;" id="itemsTable">
                <thead class="table-light">
                    <tr><th>Supply</th><th>Qty</th><th>Unit Price</th><th>Total</th><th></th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td><select name="supply[]" class="form-select form-select-sm">
                            {% for s in supplies %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
                        </select></td>
                        <td><input type="number" name="quantity[]" class="form-control form-control-sm qty" value="1" min="1"></td>
                        <td><input type="number" name="unit_price[]" class="form-control form-control-sm price" value="0" step="0.01"></td>
                        <td><span class="row-total fw-medium">0.00</span></td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger btn-icon remove-row"><i class="bi bi-trash"></i></button></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr><td colspan="3" class="text-end fw-medium">Grand Total:</td><td><span id="grandTotal" class="fw-bold">0.00</span></td><td></td></tr>
                </tfoot>
            </table>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="addRow"><i class="bi bi-plus-lg me-1"></i>Add Item</button>
            <div class="mb-4">
                <label class="form-label small fw-medium">Notes</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Create PO</button>
                <a href="{% url 'inventory:po_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function calcRow(r){const q=parseFloat(r.find('.qty').val())||0,p=parseFloat(r.find('.price').val())||0;r.find('.row-total').text((q*p).toFixed(2));calcTotal()}
function calcTotal(){let t=0;$('.row-total').each(function(){t+=parseFloat($(this).text())||0});$('#grandTotal').text(t.toFixed(2))}
$(document).on('input','.qty,.price',function(){calcRow($(this).closest('tr'))});
$('#addRow').click(function(){const t=$('#itemsTable tbody tr:first').clone();t.find('input').val('');t.find('.row-total').text('0.00');$('#itemsTable tbody').append(t)});
$(document).on('click','.remove-row',function(){if($('#itemsTable tbody tr').length>1)$(this).closest('tr').remove();calcTotal()});
</script>
{% endblock %}
