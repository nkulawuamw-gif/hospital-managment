{% extends 'base.html' %}
{% block title %}Add Supplier - HMS{% endblock %}
{% block page_title %}Add Supplier{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-medium">Company Name *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Contact Person</label>
                <input type="text" name="contact_person" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Phone *</label>
                <input type="text" name="phone" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-medium">Address</label>
                <textarea name="address" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Add Supplier</button>
                <a href="{% url 'inventory:supplier_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
