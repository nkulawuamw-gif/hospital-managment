{% extends 'base.html' %}
{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Department - HMS{% endblock %}
{% block page_title %}{% if is_edit %}Edit Department{% else %}Add Department{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 700px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label small fw-medium">Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ dept.name|default:'' }}" required placeholder="e.g. Cardiology">
                </div>
                <div class="col-12">
                    <label class="form-label small fw-medium">Description</label>
                    <textarea name="description" class="form-control" rows="2">{{ dept.description|default:'' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ dept.location|default:'' }}" placeholder="e.g. Block A, 2nd Floor">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ dept.phone|default:'' }}">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="active" {% if dept.is_active or not is_edit %}checked{% endif %}>
                        <label class="form-check-label small" for="active">Active</label>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>{% if is_edit %}Update{% else %}Create{% endif %}</button>
                <a href="{% url 'doctors:departments' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
