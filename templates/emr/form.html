{% extends 'base.html' %}
{% block title %}New Consultation - EMR - HMS{% endblock %}
{% block page_title %}New Consultation Record{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Patient *</label>
                    <select name="patient" class="form-select select2" required>
                        <option value="">-- Select Patient --</option>
                        {% for p in patients %}
                        <option value="{{ p.pk }}">{{ p.patient_id }} - {{ p.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Doctor *</label>
                    <select name="doctor" class="form-select select2" required>
                        <option value="">-- Select Doctor --</option>
                        {% for d in doctors %}
                        <option value="{{ d.pk }}" {% if request.user.role == 'doctor' and request.user.pk == d.pk %}selected{% endif %}>Dr. {{ d.get_full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Appointment</label>
                    <select name="appointment" class="form-select">
                        <option value="">-- None --</option>
                        {% for a in appointments %}
                        <option value="{{ a.pk }}">{{ a.patient.full_name }} - {{ a.appointment_date|date:"M d" }} {{ a.appointment_time|time:"H:i" }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-medium">Chief Complaint *</label>
                <textarea name="chief_complaint" class="form-control" rows="2" required placeholder="Patient's primary complaint"></textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Symptoms</label>
                    <textarea name="symptoms" class="form-control" rows="3" placeholder="Describe symptoms"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Diagnosis</label>
                    <textarea name="diagnosis" class="form-control" rows="3" placeholder="Clinical diagnosis"></textarea>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-medium">ICD Codes</label>
                <select name="icd_codes" class="form-select select2" multiple>
                    {% for code in icd_codes %}
                    <option value="{{ code.pk }}">{{ code.code }} - {{ code.description|truncatechars:60 }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-medium">Treatment Plan</label>
                <textarea name="treatment_plan" class="form-control" rows="3" placeholder="Prescribed treatment plan"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-medium">Additional Notes</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-medium">Follow-up Date</label>
                <input type="date" name="follow_up_date" class="form-control" style="max-width: 250px;">
            </div>

            <hr class="my-3">
            <h6 class="fw-semibold mb-3"><i class="bi bi-file-text me-2"></i>SOAP Notes</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Subjective</label>
                    <textarea name="subjective" class="form-control" rows="3" placeholder="Patient's description of symptoms"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Objective</label>
                    <textarea name="objective" class="form-control" rows="3" placeholder="Objective clinical findings (vitals, exam results)"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Assessment</label>
                    <textarea name="assessment" class="form-control" rows="3" placeholder="Assessment and differential diagnosis"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Plan</label>
                    <textarea name="plan" class="form-control" rows="3" placeholder="Detailed treatment plan"></textarea>
                </div>
            </div>

            <div class="d-flex gap-2 pt-3 border-top">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Save Consultation</button>
                <a href="{% url 'emr:list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
