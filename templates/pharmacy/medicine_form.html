{% extends 'base.html' %}
{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Medicine - HMS{% endblock %}
{% block page_title %}{% if is_edit %}Edit Medicine{% else %}Add New Medicine{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 700px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ med.name|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Category</label>
                    <select name="category" class="form-select">
                        <option value="">-- None --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.pk }}" {% if med.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Brand</label>
                    <input type="text" name="brand" class="form-control" value="{{ med.brand|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Generic Name</label>
                    <input type="text" name="generic_name" class="form-control" value="{{ med.generic_name|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Unit *</label>
                    <select name="unit" class="form-select">
                        <option value="tablet" {% if med.unit == 'tablet' %}selected{% endif %}>Tablet</option>
                        <option value="capsule" {% if med.unit == 'capsule' %}selected{% endif %}>Capsule</option>
                        <option value="ml" {% if med.unit == 'ml' %}selected{% endif %}>ML</option>
                        <option value="mg" {% if med.unit == 'mg' %}selected{% endif %}>MG</option>
                        <option value="injection" {% if med.unit == 'injection' %}selected{% endif %}>Injection</option>
                        <option value="syrup" {% if med.unit == 'syrup' %}selected{% endif %}>Syrup</option>
                        <option value="cream" {% if med.unit == 'cream' %}selected{% endif %}>Cream</option>
                        <option value="drops" {% if med.unit == 'drops' %}selected{% endif %}>Drops</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Strength</label>
                    <input type="text" name="strength" class="form-control" value="{{ med.strength|default:'' }}" placeholder="e.g. 500mg">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Packaging</label>
                    <input type="text" name="packaging" class="form-control" value="{{ med.packaging|default:'' }}" placeholder="e.g. 100 tabs">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Selling Price (MWK)</label>
                    <input type="number" name="selling_price" class="form-control" value="{{ med.selling_price|default:'0' }}" step="0.01">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Cost Price (MWK)</label>
                    <input type="number" name="cost_price" class="form-control" value="{{ med.cost_price|default:'0' }}" step="0.01">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Reorder Level</label>
                    <input type="number" name="reorder_level" class="form-control" value="{{ med.reorder_level|default:'10' }}">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="requires_prescription" class="form-check-input" id="rx" {% if med.requires_prescription or not is_edit %}checked{% endif %}>
                        <label class="form-check-label small" for="rx">Requires Prescription</label>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>{% if is_edit %}Update{% else %}Add{% endif %} Medicine</button>
                <a href="{% url 'pharmacy:medicines' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
