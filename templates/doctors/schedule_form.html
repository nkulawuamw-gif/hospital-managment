{% extends 'base.html' %}
{% block title %}New Schedule - HMS{% endblock %}
{% block page_title %}Add Doctor Schedule{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 700px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label small fw-medium">Doctor *</label>
                    <select name="doctor" class="form-select select2" required>
                        <option value="">-- Select Doctor --</option>
                        {% for d in doctors %}
                        <option value="{{ d.user.pk }}">Dr. {{ d.user.get_full_name }} ({{ d.department.name|default:'No dept' }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-medium">Date *</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-medium">From *</label>
                    <input type="time" name="from_time" class="form-control" value="08:00" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-medium">To *</label>
                    <input type="time" name="to_time" class="form-control" value="17:00" required>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_available" class="form-check-input" id="avail" checked>
                        <label class="form-check-label small" for="avail">Available (uncheck to mark as day off)</label>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label small fw-medium">Reason (if unavailable)</label>
                    <textarea name="reason_unavailable" class="form-control" rows="2" placeholder="e.g. Conference attendance, sick leave"></textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>Save</button>
                <a href="{% url 'doctors:schedules' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
