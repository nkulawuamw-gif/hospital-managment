databases:
  - name: hms-db
    databaseName: hms_db
    user: hms_user
    plan: free
    region: ohio

services:
  - type: web
    name: hms
    runtime: python
    plan: free
    region: ohio
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: hms-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hms-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: hms-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hms-db
          property: port
      - key: DISABLE_REDIS
        value: True
      - key: DISABLE_CELERY
        value: True
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: JWT_ACCESS_TOKEN_LIFETIME_HOURS
        value: 1
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: 30
      - key: SITE_NAME
        value: Hope Medi - Clinic
      - key: PYTHON_VERSION
        value: 3.12.0
