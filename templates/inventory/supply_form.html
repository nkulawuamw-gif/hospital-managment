{% extends 'base.html' %}
{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Supply - HMS{% endblock %}
{% block page_title %}{% if is_edit %}Edit Supply{% else %}Add Supply Item{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-medium">Name *</label>
                <input type="text" name="name" class="form-control" value="{{ supply.name|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-medium">Category</label>
                <select name="category" class="form-select">
                    <option value="">-- None --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.pk }}" {% if supply.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Unit</label>
                    <select name="unit" class="form-select">
                        <option value="piece" {% if supply.unit == 'piece' %}selected{% endif %}>Piece</option>
                        <option value="pack" {% if supply.unit == 'pack' %}selected{% endif %}>Pack</option>
                        <option value="box" {% if supply.unit == 'box' %}selected{% endif %}>Box</option>
                        <option value="liter" {% if supply.unit == 'liter' %}selected{% endif %}>Liter</option>
                        <option value="kilogram" {% if supply.unit == 'kilogram' %}selected{% endif %}>Kg</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Current Stock</label>
                    <input type="number" name="current_stock" class="form-control" value="{{ supply.current_stock|default:'0' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-medium">Reorder Level</label>
                    <input type="number" name="reorder_level" class="form-control" value="{{ supply.reorder_level|default:'10' }}">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-medium">Unit Price (KES)</label>
                <input type="number" name="unit_price" class="form-control" value="{{ supply.unit_price|default:'0' }}" step="0.01">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg me-1"></i>{% if is_edit %}Update{% else %}Add{% endif %} Supply</button>
                <a href="{% url 'inventory:supply_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
